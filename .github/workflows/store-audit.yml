# Weekly store audit: fails (and so emails the repo owner, per GitHub notification
# settings) when an app published on the App Store or Google Play has no catalog
# entry, or a catalog store link stopped resolving. Read-only: it never writes data.
# Renamed listings and privacy links are listed in the job log.
#
# To refresh ratings and screenshots, run locally on macOS:
#   node scripts/store-sync.mjs --screenshots

name: Store audit

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/store-sync.mjs --check
